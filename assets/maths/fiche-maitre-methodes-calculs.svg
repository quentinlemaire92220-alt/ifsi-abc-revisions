<svg xmlns="http://www.w3.org/2000/svg" width="1055" height="1491" viewBox="0 0 1055 1491" role="img" aria-labelledby="mainTitle desc"><title id="mainTitle">Fiche maître - Méthodes de calculs infirmiers</title><desc id="desc">Huit repères de révision : méthode, conversions, proportionnalité, concentrations, perfusions, électrolytes, dilutions et sécurité.</desc><defs><linearGradient id="bg" x2=".8" y2="1"><stop offset="0" stop-color="#f3fff0"/><stop offset="1" stop-color="#d8f3d8"/></linearGradient><linearGradient id="hdr" x2="1" y2="1"><stop offset="0" stop-color="#087450"/><stop offset="1" stop-color="#003e32"/></linearGradient><style><![CDATA[.small{font:700 24px "DejaVu Sans",sans-serif;fill:#d7ffda;letter-spacing:1px}.head{font:900 60px "DejaVu Sans",sans-serif;fill:#ffffff}.sub{font:700 26px "DejaVu Sans",sans-serif;fill:#063d30}.num{font:900 26px "DejaVu Sans",sans-serif;fill:#063b2b}.panel-title{font:800 25px "DejaVu Sans",sans-serif;fill:#ffffff}.body{font:600 19px "DejaVu Sans",sans-serif;fill:#123a30}.foot-head{font:900 32px "DejaVu Sans",sans-serif;fill:#003f34}.foot{font:700 23px "DejaVu Sans",sans-serif;fill:#154e3c}]]></style></defs><rect width="1055" height="1491" fill="url(#bg)"/><g fill="#75cc9b" opacity=".35"><circle cx="52" cy="43" r="24"/><circle cx="974" cy="78" r="27"/><circle cx="1012" cy="1392" r="22"/></g><g fill="#fada3d" opacity=".6"><circle cx="1021" cy="182" r="12"/><circle cx="30" cy="1315" r="18"/><circle cx="982" cy="1204" r="11"/></g><rect x="26" y="24" width="1003" height="170" rx="34" fill="url(#hdr)"/><rect x="63" y="37" width="370" height="37" rx="18" fill="#ffdc44"/><text x="83" y="64" font-size="20" font-weight="900" font-family="DejaVu Sans,sans-serif" fill="#064832">UE S1 B3 • CALCULS DE DOSES</text><text x="65" y="128" class="head">FICHE MAÎTRE</text><text x="64" y="166" class="small">Méthodes de calculs infirmiers • Mémo visuel</text><circle cx="927" cy="107" r="55" fill="#ffe14a"/><g stroke="#004f3d" fill="none" stroke-width="9" stroke-linecap="round"><path d="M915 72h27v68h-27z"/><path d="M922 88h13M922 103h13M922 118h13"/></g><g><rect x="38" y="221" width="487" height="240" rx="23" fill="#1d5e49" opacity=".13"/><rect x="34" y="214" width="487" height="240" rx="23" fill="#ffffff" stroke="#086342" stroke-width="3"/><path d="M56,225h443q15,0 15,15v40H41V240q0,-15 15,-15Z" fill="#075c45"/><circle cx="75" cy="254" r="33" fill="#ffe34f" stroke="#fff" stroke-width="4"/><text x="75" y="263" text-anchor="middle" class="num">01</text><text x="125" y="263" class="panel-title">Méthode en 6 étapes</text><text x="62" y="314" class="body">Repérer la question posée.</text><text x="62" y="341" class="body">Relever les données et les unités.</text><text x="62" y="368" class="body">Harmoniser les unités.</text><text x="62" y="395" class="body">Choisir la formule adaptée.</text><text x="62" y="422" class="body">Calculer sans arrondir entre étapes.</text><text x="62" y="449" class="body">Conclure : unité + ordre de grandeur.</text></g><g><rect x="538" y="221" width="487" height="240" rx="23" fill="#1d5e49" opacity=".13"/><rect x="534" y="214" width="487" height="240" rx="23" fill="#ffffff" stroke="#086342" stroke-width="3"/><path d="M556,225h443q15,0 15,15v40H541V240q0,-15 15,-15Z" fill="#075c45"/><circle cx="575" cy="254" r="33" fill="#ffe34f" stroke="#fff" stroke-width="4"/><text x="575" y="263" text-anchor="middle" class="num">02</text><text x="625" y="263" class="panel-title">Conversions</text><text x="562" y="314" class="body">1 kg = 1 000 g ; 1 g = 1 000 mg</text><text x="562" y="341" class="body">1 mg = 1 000 µg</text><text x="562" y="368" class="body">1 L = 10 dL = 100 cL = 1 000 mL</text><text x="562" y="395" class="body">1 h = 60 min ; 24 h = 1 440 min</text><text x="562" y="422" class="body">2 h 30 = 2,5 h = 150 min</text><text x="562" y="449" class="body">Surveiller les facteurs 10 et 1 000.</text></g><g><rect x="38" y="482" width="487" height="240" rx="23" fill="#1d5e49" opacity=".13"/><rect x="34" y="475" width="487" height="240" rx="23" fill="#ffffff" stroke="#086342" stroke-width="3"/><path d="M56,486h443q15,0 15,15v40H41V501q0,-15 15,-15Z" fill="#075c45"/><circle cx="75" cy="515" r="33" fill="#ffe34f" stroke="#fff" stroke-width="4"/><text x="75" y="524" text-anchor="middle" class="num">03</text><text x="125" y="524" class="panel-title">Proportionnalité et doses</text><text x="62" y="575" class="body">Produit en croix : x = a × V / b</text><text x="62" y="602" class="body">Nb d'unités = dose / dose par unité</text><text x="62" y="629" class="body">Volume = dose / concentration</text><text x="62" y="656" class="body">Toujours vérifier la compatibilité</text><text x="62" y="683" class="body">des unités avant de calculer.</text></g><g><rect x="538" y="482" width="487" height="240" rx="23" fill="#1d5e49" opacity=".13"/><rect x="534" y="475" width="487" height="240" rx="23" fill="#ffffff" stroke="#086342" stroke-width="3"/><path d="M556,486h443q15,0 15,15v40H541V501q0,-15 15,-15Z" fill="#075c45"/><circle cx="575" cy="515" r="33" fill="#ffe34f" stroke="#fff" stroke-width="4"/><text x="575" y="524" text-anchor="middle" class="num">04</text><text x="625" y="524" class="panel-title">Concentrations</text><text x="562" y="575" class="body">C = m / V ; m = C × V ; V = m / C</text><text x="562" y="602" class="body">1 % m/V = 1 g pour 100 mL</text><text x="562" y="629" class="body">1 ‰ m/V = 1 g pour 1 000 mL</text><text x="562" y="656" class="body">x % m/V = 10 × x mg/mL</text><text x="562" y="683" class="body">Vérifier les unités de l'énoncé.</text></g><g><rect x="38" y="743" width="487" height="240" rx="23" fill="#1d5e49" opacity=".13"/><rect x="34" y="736" width="487" height="240" rx="23" fill="#ffffff" stroke="#086342" stroke-width="3"/><path d="M56,747h443q15,0 15,15v40H41V762q0,-15 15,-15Z" fill="#075c45"/><circle cx="75" cy="776" r="33" fill="#ffe34f" stroke="#fff" stroke-width="4"/><text x="75" y="785" text-anchor="middle" class="num">05</text><text x="125" y="785" class="panel-title">Perfusions et débits</text><text x="62" y="836" class="body">Débit (mL/h) = V (mL) / T (h)</text><text x="62" y="863" class="body">Gouttes/min = V × facteur / T (min)</text><text x="62" y="890" class="body">Durée (h) = V / débit (mL/h)</text><text x="62" y="917" class="body">Horaire de fin = départ + durée</text><text x="62" y="944" class="body">Reste = initial − déjà perfusé.</text></g><g><rect x="538" y="743" width="487" height="240" rx="23" fill="#1d5e49" opacity=".13"/><rect x="534" y="736" width="487" height="240" rx="23" fill="#ffffff" stroke="#086342" stroke-width="3"/><path d="M556,747h443q15,0 15,15v40H541V762q0,-15 15,-15Z" fill="#075c45"/><circle cx="575" cy="776" r="33" fill="#ffe34f" stroke="#fff" stroke-width="4"/><text x="575" y="785" text-anchor="middle" class="num">06</text><text x="625" y="785" class="panel-title">Électrolytes et ajouts</text><text x="562" y="836" class="body">Pour un dosage en g/L : V en litres.</text><text x="562" y="863" class="body">« Par litre » ≠ « par poche ».</text><text x="562" y="890" class="body">Sans retrait : Vfinal = Vbase + ajouts.</text><text x="562" y="917" class="body">Si demandé, utiliser Vfinal</text><text x="562" y="944" class="body">pour calculer le débit.</text></g><g><rect x="38" y="1004" width="487" height="240" rx="23" fill="#1d5e49" opacity=".13"/><rect x="34" y="997" width="487" height="240" rx="23" fill="#ffffff" stroke="#086342" stroke-width="3"/><path d="M56,1008h443q15,0 15,15v40H41V1023q0,-15 15,-15Z" fill="#075c45"/><circle cx="75" cy="1037" r="33" fill="#ffe34f" stroke="#fff" stroke-width="4"/><text x="75" y="1046" text-anchor="middle" class="num">07</text><text x="125" y="1046" class="panel-title">Reconstitution et dilution</text><text x="62" y="1097" class="body">Reconstitution : C = masse / Vfinal</text><text x="62" y="1124" class="body">Dilution : C₁ × V₁ = C₂ × V₂</text><text x="62" y="1151" class="body">Si les volumes sont additifs :</text><text x="62" y="1178" class="body">Vdiluant = Vfinal − Vinitial</text><text x="62" y="1205" class="body">Arrondir seulement le résultat final.</text></g><g><rect x="538" y="1004" width="487" height="240" rx="23" fill="#1d5e49" opacity=".13"/><rect x="534" y="997" width="487" height="240" rx="23" fill="#ffffff" stroke="#086342" stroke-width="3"/><path d="M556,1008h443q15,0 15,15v40H541V1023q0,-15 15,-15Z" fill="#075c45"/><circle cx="575" cy="1037" r="33" fill="#ffe34f" stroke="#fff" stroke-width="4"/><text x="575" y="1046" text-anchor="middle" class="num">08</text><text x="625" y="1046" class="panel-title">Pièges et sécurité</text><text x="562" y="1097" class="body">Recontrôler g / mg / µg et h / min.</text><text x="562" y="1124" class="body">Vérifier le volume final.</text><text x="562" y="1151" class="body">Un résultat mathématique ne valide pas</text><text x="562" y="1178" class="body">à lui seul une administration réelle.</text><text x="562" y="1205" class="body">KCl injectable : jamais en IV directe.</text></g><rect x="34" y="1260" width="987" height="192" rx="28" fill="#ffe562" stroke="#08734c" stroke-width="5"/><text x="69" y="1316" class="foot-head">LE RÉFLEXE EXAMEN</text><text x="69" y="1363" class="foot">Question → unités → formule → calcul → réponse avec unité</text><text x="69" y="1400" class="foot">→ vérification de l'ordre de grandeur et de la sécurité.</text><text x="69" y="1434" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#305a46">Document pédagogique : respecter la prescription et les protocoles en situation réelle.</text><text x="527" y="1477" text-anchor="middle" font-size="17" font-family="DejaVu Sans,sans-serif" fill="#28644f">Fiche de révision • Synthèse issue de la fiche maître PDF existante</text></svg>