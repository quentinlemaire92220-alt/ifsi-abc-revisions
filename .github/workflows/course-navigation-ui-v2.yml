name: UI Cours V2 — Test navigateur avant validation

on:
  pull_request:
    paths:
      - 'course-navigation-ui-v2.js'
      - 'v74-pack.js'
      - 'course-thumbnails-v1.js'
      - 'course-registry-v741.json'
      - 'course-registry-v741.js'
      - 'sw.js'
      - 'docs/course-deliveries.json'
      - 'assets/**'
      - 'sheets-*.json'
      - 'vocals.json'
      - 'questions-*.json'
      - 'qextra-*.txt'
      - 'data/course-banks/**'
      - 'vocabulaire-v1.json'
      - 'tools/course-resource-access.mjs'
      - 'tests/course-resource-access.mjs'
      - 'tests/flashcards-runtime-fixture.mjs'
      - 'tests/course-ue-grouping.mjs'
      - 'tests/course-thumbnails-dynamic.mjs'
      - 'index.html'
      - 'build-meta.json'
      - 'tests/fixtures/course-navigation-ui-v2.js'
      - 'tests/course-navigation-ui-v2-smoke.mjs'
      - 'tests/course-navigation-ui-v2-browser.mjs'
      - 'tests/fixtures/course-navigation-v2-browser.html'
      - 'tests/fixtures/course-navigation-v2-full-app.js'
      - 'tests/course-navigation-ui-v2-full-app.mjs'
      - '.github/workflows/course-navigation-ui-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-course-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier les accès actifs avant le navigateur
        run: node tests/course-resource-access.mjs
      - name: Test sans navigateur — mutations et arrêt sur erreur
        run: node tests/course-navigation-ui-v2-smoke.mjs
      - name: Test Chromium réel — ordre, repli, thèmes, handlers, absence de gel
        run: node tests/course-navigation-ui-v2-browser.mjs
      - name: Lancement de toute l'application (190 modules) en test local Chromium PC/mobile
        run: node tests/course-navigation-ui-v2-full-app.mjs
