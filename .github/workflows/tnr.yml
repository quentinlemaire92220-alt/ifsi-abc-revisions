  preflight:
    name: Préflight préparation et publication
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/ci-pdf-requirements.txt
      - run: python -m pip install -r tools/ci-pdf-requirements.txt
      - name: Déterminer la base explicite
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="$PR_BASE_SHA"
          if [[ -z "$base" ]]; then base="$PUSH_BEFORE_SHA"; fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then base=$(git rev-parse HEAD^); fi
          git cat-file -e "$base^{commit}"
          printf 'IFSI_BASE_SHA=%s\n' "$base" >> "$GITHUB_ENV"
      - name: QA des contrats pédagogiques en préparation
        run: node tools/course-preflight.mjs --stage preparation --report preflight-reports/preparation.json
      - name: QA technique et autorisation de publication
        if: ${{ !cancelled() }}
        run: node tools/course-preflight.mjs --stage publication --report preflight-reports/publication.json
      - name: Conserver tous les résultats ciblés
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preflight-${{ github.run_id }}
          path: preflight-reports/
          if-no-files-found: error
          retention-days: 30
