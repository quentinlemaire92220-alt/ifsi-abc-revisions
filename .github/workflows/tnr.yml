name: TNR IFSI ABC

permissions:
  contents: read

concurrency:
  group: tnr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, 'v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tnr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Déterminer la version publiée de comparaison
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ -n "$PR_BASE_SHA" ]]; then
            base="$PR_BASE_SHA"
          elif [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" && "$PUSH_BEFORE_SHA" =~ ^[a-f0-9]{40}$ && ! "$PUSH_BEFORE_SHA" =~ ^0{40}$ ]]; then
            base="$PUSH_BEFORE_SHA"
          else
            base=$(git merge-base HEAD "origin/$DEFAULT_BRANCH")
            if [[ "$base" == "$(git rev-parse HEAD)" ]]; then
              base=$(git rev-parse HEAD^)
            fi
          fi
          git cat-file -e "$base^{commit}"
          printf 'IFSI_BASE_SHA=%s\n' "$base" >> "$GITHUB_ENV"

      - name: Vérifier la syntaxe JavaScript
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          for file in ./*.js tests/*.mjs; do
            node --check "$file"
          done

      - name: Vérifier les cours rapprochés des captures V8.30.95
        if: ${{ !cancelled() }}
        run: node tests/course-revisions-v8395.mjs

      - name: Vérifier la publication limitée aux deux fiches validées
        if: ${{ !cancelled() }}
        run: node tests/revision-sheet-supplement-test.mjs

      - name: Vérifier les compléments sans remplacement des ressources historiques
        if: ${{ !cancelled() }}
        run: node tests/course-complement-additive-test.mjs

      - name: Valider les PDF et corrections du TD2 à publier
        if: ${{ !cancelled() }}
        run: node tests/posture-td2-publication-gate.mjs

      - name: Vérifier l'isolement, les réponses et la propreté des cours en préparation
        if: ${{ !cancelled() }}
        run: node tests/posture-td2-bank-integrity.mjs

      - name: Charte v1.49 — reçu de revue des fiches nouvelles ou modifiées (contrat)
        if: ${{ !cancelled() }}
        run: |
          node tools/pedagogical-non-regression-v149.mjs --self-test
          node tools/pedagogical-non-regression-v149.mjs --base "$IFSI_BASE_SHA"

      - name: Tests de non-régression données et runtime
        if: ${{ !cancelled() }}
        run: node tests/tnr-node.mjs

      - name: Contrôler les 18 flashcards complémentaires P3 et la PWA
        if: ${{ !cancelled() }}
        run: node tests/p3-flashcards-release.mjs

      - name: Configurer Python pour les contrôles PDF
        if: ${{ !cancelled() }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/ci-pdf-requirements.txt

      - name: Installer le moteur de contrôle PDF
        if: ${{ !cancelled() }}
        run: python -m pip install -r tools/ci-pdf-requirements.txt

      - name: TNR propreté des PDF et scripts vocaux étudiants
        if: ${{ !cancelled() }}
        run: python tests/student_support_clean_gate_test.py

      - name: TNR moteur de production des deux PDF (fixtures fictives)
        if: ${{ !cancelled() }}
        run: python tests/revision-course-pack-test.py

      - name: TNR contrat des deux fiches et preuves PDF
        if: ${{ !cancelled() }}
        run: node tests/dual-sheet-contract-test.mjs

      - name: TNR nouveau pack allégé et anciens contrats
        if: ${{ !cancelled() }}
        run: node tests/lean-course-contract-test.mjs

      - name: TNR nouveau contrat hybride v1.46 (un PDF, lexique et preuves)
        if: ${{ !cancelled() }}
        run: node tests/hybrid-sheet-contract-test.mjs

      - name: TNR nouveau standard fiche écrite V5.3 (sans images, synthèse avant lexique)
        if: ${{ !cancelled() }}
        run: node tests/written-sheet-contract-test.mjs

      - name: TNR affichage des fiches hybrides sans publication implicite de Douleur
        if: ${{ !cancelled() }}
        run: node tests/hybrid-sheet-ui-test.mjs

      - name: TNR cardinalité QCM dans le Service Worker
        if: ${{ !cancelled() }}
        run: node tests/lean-qcm-sw-guard-test.mjs

      - name: TNR chaîne de production locale du pack allégé
        if: ${{ !cancelled() }}
        run: python tests/lean-course-pack-test.py

      - name: TNR générateur privé de fiche hybride v1.46
        if: ${{ !cancelled() }}
        run: python tests/hybrid-course-pack-test.py

      - name: TNR fiche unique et planches complètes complémentaires
        if: ${{ !cancelled() }}
