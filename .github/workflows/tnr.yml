      - name: Vérifier le volet care p02 et les ressources antérieures
        if: ${{ !cancelled() }}
        run: node tests/ethiques-care-p02.mjs

      - name: TNR registre prive des sources manquantes v1.15
        if: ${{ !cancelled() }}
