      - name: Contrôler les 3 supports officiels et le pilote QCM/flashcards (non publié)
        if: ${{ !cancelled() }}
        run: node tests/official-supports-pilot-20261019.mjs

      - name: TNR suivi des cours et confidentialité
        if: ${{ !cancelled() }}
