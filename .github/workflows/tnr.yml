      - name: TNR galerie anatomique provisoire R02-R07 V8.30.102
        if: ${{ !cancelled() }}
        run: node tests/anatomy-reproductive-preview-v8402.mjs

      - name: Vérifier la nouvelle méthode de production anatomique SVG
        if: ${{ !cancelled() }}
