name: TNR IFSI ABC

permissions:
  contents: read

concurrency:
  group: tnr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, 'v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tnr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Vérifier la syntaxe JavaScript
        run: |
          set -euo pipefail
          for file in ./*.js tests/*.mjs; do
            node --check "$file"
          done

      - name: Vérifier les cours rapprochés des captures V8.30.95
        run: node tests/course-revisions-v8395.mjs

      - name: Tests de non-régression données et runtime
        run: node tests/tnr-node.mjs

      - name: Tester le contrôle PDF sur des documents fictifs
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer le moteur de contrôle PDF
        run: python -m pip install pymupdf==1.26.7

      - name: Installer le moteur de composition de fiches
        run: python -m pip install reportlab==4.4.9 Pillow

      - name: TNR moteur de production des deux PDF (fixtures fictives)
        run: python tests/revision-course-pack-test.py

      - name: TNR contrat des deux fiches et preuves PDF
        run: node tests/dual-sheet-contract-test.mjs

      - name: TNR registre prive des sources manquantes v1.15
        run: node tests/source-followup-v115-test.mjs

      - name: Contrôler les 3 supports officiels et le pilote QCM/flashcards (non publié)
        run: node tests/official-supports-pilot-20261019.mjs

      - name: TNR suivi des cours et confidentialité
        run: node tests/course-followup-v1.mjs

      - name: TNR classement des nouvelles planches dans Anatomie
        run: node tests/anatomy-routing-contract-test.mjs

      - name: TNR suivi reproducteur V8.30.97 sans diffusion de maquettes
        run: node tests/anatomy-reproductive-release-v8397.mjs

      - name: TNR P1 anatomie après V8.30.97 — masquage DOM et 106 planches
        run: node tests/anatomy-p1-guards-v8397.mjs

      - name: TNR mise en page adaptative des fiches
        run: python tests/revision-layout-test.py

      - name: TNR visuels PDF absents, mal placés et illisibles
        run: python tests/pdf_visual_gate_test.py

      - name: Vérifier la copie PDF retéléchargée après publication
        run: python tests/verify_published_pdf_test.py

      - name: Valider le résumé de contrôle avant nouvelle publication
        run: node tests/pdf-visual-audit-contract-test.mjs

      - name: TNR ajout de parties à des cours déjà publiés
        run: node tests/course-delivery-parts-test.mjs

      - name: Contrôler les packs de cours validés et leurs ressources
        run: node tests/course-delivery.mjs

      - name: Tester le refus de publication sans validation du package
        run: node tests/course-publication-approval-test.mjs

      - name: Exiger le GO publication pour les lots nouveaux ou modifiés
        env:
          IFSI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node tests/course-publication-approval.mjs

      - name: Refuser un nouveau cours publié absent du manifeste
        env:
          IFSI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node tests/course-delivery-new-course.mjs

      - name: Refuser les nouvelles parties non déclarées des cours déjà publiés
        env:
          IFSI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node tests/course-delivery-parts.mjs

      - name: Vérifier la séparation des séances simultanées par sous-groupe
        run: node tests/planning-group-separation.mjs

      - name: Régression UX et cohérence release
        run: node tests/ux-regression.mjs

      - name: Contrôle Paramètres P1
        run: node tests/settings-compact-p1.mjs

      - name: Tester les formulations QCM indépendantes du TD
        run: node tests/qcm-autonomy-contract-test.mjs

      - name: Vérifier le lot QCM A1-P03 et son GO publication signé par empreinte
        run: node tests/qcm-reviewed-publication-a1p3.mjs

      - name: Refuser les nouveaux QCM et flashcards dépendant du support
        env:
          IFSI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node tests/qcm-autonomy-changed.mjs

      - name: Vérifier le vocabulaire dans les QCM
        run: node tests/vocabulary-qcm-v8379.mjs

      - name: Vérifier le module Flashcards
        run: node tests/flashcards-v8338.mjs

      - name: Vérifier le retour des QCM par cours V8.30.57
        run: node tests/qcm-access-v8357.mjs

      - name: Vérifier le préparateur d'annales 2025 sans publication
        run: node tests/annales-preparation-v1.mjs

      - name: Auditer les QCM et flashcards des annales 2025 publiées
        run: node tests/annales-publication-v1.mjs

      - name: Tester le chargement QCM Android et l'état zéro question
        run: node tests/qcm-live-loading-v8374.mjs

      - name: Tester la reprise des packs QCM partiels
        run: node tests/qcm-partial-recovery-v8376.mjs

      - name: Vérifier le correctif UI V8.30.39
        run: node tests/ui-v8339.mjs

      - name: Vérifier les flashcards pédagogiques V8.30.41
        run: node tests/flashcards-pedagogy-v8341.mjs

      - name: Vérifier les formulations Flashcards V8.30.42
        run: node tests/flashcards-wording-v8342.mjs

      - name: Vérifier l’autonomie des Flashcards V8.30.43
        run: node tests/flashcards-context-v8343.mjs

      - name: Vérifier la récupération des Flashcards V8.30.44
        run: node tests/flashcards-recovery-v8344.mjs

      - name: Inventaire qualité Flashcards
        run: node tests/flashcards-inventory-v8345.mjs

      - name: Vérifier la compréhension Flashcards sur les banques de production
        run: node tests/flashcards-understanding-v8369.mjs

      - name: Garde-fou Flashcards par cours
        run: node tests/flashcards-course-gate-v8352.mjs

      - name: Vérifier les Flashcards atomiques V8.30.45
        run: node tests/flashcards-atomic-v8345.mjs

      - name: Vérifier les associations contextualisées V8.30.46
        run: node tests/flashcards-context-atomic-v8346.mjs

      - name: Vérifier la cohérence recto/verso V8.30.48
        run: node tests/flashcards-coherence-v8348.mjs

      - name: Vérifier la contextualisation Flashcards V8.30.51
        run: node tests/flashcards-context-v8351.mjs

      - name: Vérifier les compléments audio autorisés
        run: node tests/audio-supplement-contract-test.mjs

      - name: Vérifier les cinq vocaux retrouvés et la préservation des anciens
        run: node tests/recovered-vocals-v8394.mjs

      - name: Vérifier le lecteur vocal natif V8.30.50
        run: node tests/vocal-player-v8350.mjs

      - name: Vérifier les 226 QCM de maths, leurs résultats exacts et les 10 niveaux
        run: node tests/math-qcm-v8363.mjs

      - name: Tester les exercices pratiques de mathématiques
        run: node tests/math-case-engine-v1.mjs

      - name: Vérifier les 10 exercices approuvés, le catalogue et leurs corrections
        run: node tests/math-case-publication-v1.mjs

      - name: Contrôler les classements QCM et leurs permutations sans substitution
        run: node tests/qcm-ordering-audit.mjs

      - name: Audit fonctionnel des corrections QCM
        run: node tests/qcm-correction-audit.mjs

      - name: Exercices interactifs urinaires et erreurs QCM personnalisées
        run: node tests/interactive-exercises-v8378.mjs

      - name: Vérifier le contraste et la formulation des QCM V8.30.75
        run: node tests/qcm-visual-wording-v8375.mjs

      - name: Vérifier les QCM autonomes sans visuel absent
        run: node tests/qcm-autonomous-visuals-v8376.mjs

      - name: Audit des niveaux de difficulté QCM
        run: node tests/qcm-difficulty-audit.mjs

      - name: Audit des doublons QCM
        run: node tests/qcm-duplicates-audit.mjs

      - name: Audit de granularité des thèmes QCM
        run: node tests/qcm-theme-audit.mjs

      - name: Audit du câblage des boutons
        run: node tests/button-audit.mjs

      - name: Audit read-only des ressources existantes selon workflow v1.14
        run: node tests/workflow-resource-inventory-test.mjs

      - name: Valider le schéma de correspondance CM privé (données fictives)
        run: node tests/cm-course-crosswalk-test.mjs

      - name: Audit des rattachements de cours
        run: node tests/course-audit.mjs

      - name: Vérifier l'installation PWA Android
        run: node tests/pwa-install.mjs

      - name: Audit automatique Drive ↔ application
        run: node tests/resource-sync-v821.mjs

      - name: Vérifier les 8 fiches de mathématiques infographiques
        run: node tests/math-infographics-v8359.mjs

      - name: Contrôles correctifs du runtime V8.30.60
        run: node tests/runtime-integrity-v8360.mjs

      - name: Intégrité QCM 4 sur 4 reformattés
        run: node tests/qcm-four-of-four-v8361.mjs

      - name: Vérifier les parcours corrigés par l’audit navigateur
        run: node tests/browser-audit-v8364.mjs

      - name: Vérifier les banques réellement décodées dans le navigateur
        run: node tests/browser-runtime-v8370.mjs

      - name: Audit intégral des QCM actifs (Service Worker + filtres)
        run: node tests/qcm-full-runtime-audit-v8374.mjs

      - name: Audit hygiène du dépôt
        run: node tests/repo-hygiene.mjs

      - name: Vérifier la livraison Stomatothérapie
        run: node tests/stomatotherapie-delivery.mjs

      - name: Vérifier le lot droits_patients p01
        run: node tests/course-droits_patients-p01.mjs
