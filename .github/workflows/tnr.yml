name: TNR IFSI ABC

permissions:
  contents: read

concurrency:
  group: tnr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, 'v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tnr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Vérifier la syntaxe JavaScript
        run: |
          set -euo pipefail
          for file in ./*.js tests/*.mjs; do
            node --check "$file"
          done

      - name: Tests de non-régression données et runtime
        run: node tests/tnr-node.mjs

      - name: Régression UX et cohérence release
        run: node tests/ux-regression.mjs

      - name: Vérifier le module Flashcards
        run: node tests/flashcards-v8338.mjs

      - name: Vérifier le retour des QCM par cours V8.30.57
        run: node tests/qcm-access-v8357.mjs

      - name: Vérifier le correctif UI V8.30.39
        run: node tests/ui-v8339.mjs

      - name: Vérifier les flashcards pédagogiques V8.30.41
        run: node tests/flashcards-pedagogy-v8341.mjs

      - name: Vérifier les formulations Flashcards V8.30.42
        run: node tests/flashcards-wording-v8342.mjs

      - name: Vérifier l’autonomie des Flashcards V8.30.43
        run: node tests/flashcards-context-v8343.mjs

      - name: Vérifier la récupération des Flashcards V8.30.44
        run: node tests/flashcards-recovery-v8344.mjs

      - name: Inventaire qualité Flashcards
        run: node tests/flashcards-inventory-v8345.mjs

      - name: Garde-fou Flashcards par cours
        run: node tests/flashcards-course-gate-v8352.mjs

      - name: Vérifier les Flashcards atomiques V8.30.45
        run: node tests/flashcards-atomic-v8345.mjs

      - name: Vérifier les associations contextualisées V8.30.46
        run: node tests/flashcards-context-atomic-v8346.mjs

      - name: Vérifier la cohérence recto/verso V8.30.48
        run: node tests/flashcards-coherence-v8348.mjs

      - name: Vérifier la contextualisation Flashcards V8.30.51
        run: node tests/flashcards-context-v8351.mjs

      - name: Vérifier le lecteur vocal natif V8.30.50
        run: node tests/vocal-player-v8350.mjs

      - name: Audit fonctionnel des corrections QCM
        run: node tests/qcm-correction-audit.mjs

      - name: Audit des niveaux de difficulté QCM
        run: node tests/qcm-difficulty-audit.mjs

      - name: Audit des doublons QCM
        run: node tests/qcm-duplicates-audit.mjs

      - name: Audit de granularité des thèmes QCM
        run: node tests/qcm-theme-audit.mjs

      - name: Audit du câblage des boutons
        run: node tests/button-audit.mjs

      - name: Audit des rattachements de cours
        run: node tests/course-audit.mjs

      - name: Vérifier l'installation PWA Android
        run: node tests/pwa-install.mjs

      - name: Audit automatique Drive ↔ application
        run: node tests/resource-sync-v821.mjs

      - name: Vérifier les 8 fiches de mathématiques infographiques
        run: node tests/math-infographics-v8359.mjs

      - name: Contrôles correctifs du runtime V8.30.60
        run: node tests/runtime-integrity-v8360.mjs

      - name: Audit hygiène du dépôt
        run: node tests/repo-hygiene.mjs
