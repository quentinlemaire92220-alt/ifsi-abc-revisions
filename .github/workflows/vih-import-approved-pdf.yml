name: IFSI VIH — importer le PDF explicitement validé
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/vih-import-approved-pdf.yml']
permissions:
  contents: write
  actions: read
jobs:
  transfer-approved-qcm:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'work/vih-validated-release-v830151-20261028'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Lire la branche exacte en préparation
        uses: actions/checkout@v4
        with:
          ref: work/vih-validated-release-v830151-20261028
          persist-credentials: true
          fetch-depth: 1
      - name: Importer l'artefact privé et vérifier les octets avant Git
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: bd6cb5a4e3da27cd538cc53f9877254ef8bc16ae6fac2951df6b59caba537efc
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.repository }}" = "quentinlemaire92220-alt/ifsi-abc-revisions"
          test "${{ github.event.pull_request.number }}" = "271"
          curl -fsSL --retry 3 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/quentinlemaire92220-alt/ifsi-abc-revisions/actions/artifacts/12848167207/zip" \
            -o /tmp/vih-qcm-artefact-prive.zip
          unzip -p /tmp/vih-qcm-artefact-prive.zip VIH_QCM_50_V3_CANDIDAT.pdf > /tmp/vih-accepted-exact.pdf
          echo "${EXPECTED_SHA}  /tmp/vih-accepted-exact.pdf" | sha256sum -c -
          test "$(stat -c %s /tmp/vih-accepted-exact.pdf)" -eq 90355
          target="assets/vih-20261027/UE_B1_3_S1_VIH_QCM_50_Corriges.pdf"
          cp /tmp/vih-accepted-exact.pdf "$target"
          echo "${EXPECTED_SHA}  $target" | sha256sum -c -
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$target"
          if git diff --cached --quiet; then
            echo "PDF conforme déjà présent : aucune mutation."
          else
            git commit -m "fix(VIH): intégrer les octets du QCM final explicitement approuvé"
            git push origin HEAD:refs/heads/work/vih-validated-release-v830151-20261028
          fi
          git status --short
